name: Check Sphinx docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - name: Check Sphinx references and build HTML
        run: python -m sphinx -b html -n -W --keep-going docs/source docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/_build/html/

