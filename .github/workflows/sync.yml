name: Synchronize ORCID biosketch
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: orcid-biosketch 0000-0003-4820-7951 --config config/biosketch.json --output generated
      - name: Commit changed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "chore: synchronize ORCID biosketch"
          git push

