name: Deploy playground (Firebase Hosting)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Temporary 30-day preview channel id; 'live' is accepted only from main"
        default: preview
  # Merges to main and the weekly ORCID sync on main deploy straight to live.
  workflow_run:
    workflows: ["Synchronize ORCID biosketch"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["generated/**", "web/**", "src/**", "firebase.json", ".firebaserc", "scripts/build_site.py", "docs/**", "README.md", ".github/workflows/deploy-hosting.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  # One queue per channel, so a branch preview never cancels a deploy from main.
  group: deploy-hosting-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.channel || 'preview') || 'live' }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Server-side guard: the `live` environment only accepts main; `preview` is unrestricted.
    environment: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.channel == 'live') && 'live' || 'preview' }}
    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.channel || 'preview') || 'live' }}
    steps:
      - name: Check the requested channel
        env:
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$CHANNEL" =~ ^[a-z0-9-]{1,40}$ ]]; then
            echo "::error::Channel must be lowercase letters, digits and hyphens"; exit 1
          fi
          if [ "$CHANNEL" = "live" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Only main can be deployed to the live channel"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build Sphinx scientist documentation
        run: python -m sphinx -b html -n -W --keep-going docs/source docs/_build/html
      - run: python scripts/build_site.py site
        env:
          ORCID_CLIENT_ID: ${{ vars.ORCID_CLIENT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ORCID_EXCHANGE_URL: ${{ vars.ORCID_EXCHANGE_URL }}
      - name: Bundle documentation at /docs/
        run: mkdir -p site/docs && cp -a docs/_build/html/. site/docs/
      - name: Authenticate to Google Cloud (Workload Identity Federation, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ "$CHANNEL" = "live" ]; then
            # Both targets (.firebaserc): the app at science-record-player.web.app and the legacy
            # orcid-playground-889.web.app, which serves the same build and forwards visitors (moved.js).
            npx --yes firebase-tools@13.29.1 deploy --only hosting --project "$PROJECT"
          else
            npx --yes firebase-tools@13.29.1 hosting:channel:deploy "$CHANNEL" --expires 30d --only app --project "$PROJECT"
          fi
