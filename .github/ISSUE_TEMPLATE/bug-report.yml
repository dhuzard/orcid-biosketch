name: Report a bug or misleading result
description: Reproducible error in a public record, export, visualization or UI.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Scientific correctness and provenance errors are particularly useful. Do not post private ORCID data, contact notes or access tokens.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Studio
        - Research network / Contacts
        - Group view
        - Teams (if enabled)
        - CLI / Web Component
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce this?
      placeholder: |
        1. Open the public Playground
        2. Select the stored demonstration profile
        3. Select Record check
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus observed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / version (if relevant)
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue safety
      options:
        - label: I have removed secrets and private information.
          required: true
