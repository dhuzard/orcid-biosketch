name: Scientist feedback or feature idea
description: Tell us what you tried and what you need for real research work (no code required).
title: "[Scientist feedback] "
labels: ["enhancement", "playground"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the Playground. Please share a concrete scientific task and avoid private records, access tokens, contact notes or other sensitive information. Trying the app does not require an account; posting a GitHub issue does.
  - type: dropdown
    id: context
    attributes:
      label: Your context
      options:
        - Individual researcher
        - Lab or consortium coordinator
        - Data steward / research librarian
        - Research software developer
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe your workflow or intended outcome, not just a feature name.
      placeholder: I was preparing a team biosketch for a grant...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where?
      options:
        - Studio / record check / exports
        - Research network / Feed / People
        - Contacts
        - Groups / Group view
        - Website embed / CLI
        - Other or not sure
  - type: textarea
    id: observation
    attributes:
      label: What happened and what should improve?
      description: Include expected versus actual behavior, uncertainty or missing scientific information.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would make this genuinely useful to your research?
      description: An outcome that could guide implementation and testing.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue safety
      options:
        - label: I have removed private participant/contact information and secrets from this issue.
          required: true
